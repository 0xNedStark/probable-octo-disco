name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solar
          POSTGRES_PASSWORD: solar
          POSTGRES_DB: solar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U solar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://solar:solar@localhost:5432/solar_test
      E2E_DATABASE_URL: postgres://solar:solar@localhost:5432/solar_e2e
      DATABASE_URL: postgres://solar:solar@localhost:5432/solar_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Create e2e database
        run: PGPASSWORD=solar psql -h localhost -U solar -d solar_test -c 'CREATE DATABASE solar_e2e'
      - run: pnpm --filter @solar/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
